name: Validate sources

# Two jobs:
#   schema-check              — always runs, no network beyond cargo's own
#                                (offline JSON/schema validation). This is
#                                what gates a community contributor's PR,
#                                including into sources/private/.
#   live-check-changed-sources — runs only for verified/community files
#                                the PR actually touches; fetches each site
#                                for real and confirms selectors resolve.
#                                Deliberately skips sources/private/ (see
#                                that job's own comment below) since CI has
#                                no login session to test an authenticated
#                                site with.
on:
  pull_request:
    paths:
      - "sources/**"
      - "schema/**"
      - "crate/src/schema.rs"
  push:
    branches: [main]
    paths:
      - "sources/**"
      - "schema/**"
      - "crate/src/schema.rs"
  workflow_dispatch: {}

jobs:
  schema-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        # No `workspaces:` override — this repo has ONE workspace at
        # the repo root (see /Cargo.toml), so every member crate
        # (including tools/validator) builds into the same top-level
        # target/ dir. Building or running from inside a member's own
        # directory still resolves against that shared target/ — it
        # does NOT get its own — so every cargo/binary invocation below
        # runs from the repo root to match.

      - name: Build validator
        run: cargo build --release -p streamx-indexer-validator

      - name: Schema validation (no network)
        run: ./target/release/validator check --root .

      - name: Comment result on PR
        if: failure() && github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: "Schema validation failed — see the **schema-check** job log for exactly which file and field. Common fixes: `id` must match the filename, `mirrors` can't be empty, and `magnet_location: \"detail\"` requires `detail_link` + `detail_magnet_selector`."
            })

  # Live smoke-test only for files the PR actually touches, since
  # hitting every site on every PR would be slow and noisy for
  # unrelated contributions (e.g. a docs-only PR that happens to also
  # touch schema/README wording).
  #
  # sources/private/ is deliberately EXCLUDED from the live check (see
  # the "Determine changed source ids" step below) — every site there
  # requires an authenticated cookie the CI runner doesn't have, so an
  # unauthenticated --live run would just report a login-page response
  # as a selector mismatch: a false failure that has nothing to do with
  # whether the contributor's selectors are actually correct. Schema
  # validation (the schema-check job above, which DOES cover
  # sources/private/) is what actually gates a private-tracker PR;
  # selector correctness for those is confirmed by human review instead
  # — see docs/CONTRIBUTING.md's "Adding a private tracker" section.
  live-check-changed-sources:
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Determine changed source ids
        id: changed
        run: |
          BASE="${{ github.event.pull_request.base.sha }}"
          HEAD="${{ github.event.pull_request.head.sha }}"
          IDS=$(git diff --name-only "$BASE" "$HEAD" -- 'sources/verified/*.json' 'sources/community/*.json' \
                | xargs -n1 basename 2>/dev/null | sed 's/\.json$//' | paste -sd, -)
          echo "ids=$IDS" >> "$GITHUB_OUTPUT"

          PRIVATE_CHANGED=$(git diff --name-only "$BASE" "$HEAD" -- 'sources/private/*.json' \
                | xargs -n1 basename 2>/dev/null | sed 's/\.json$//' | paste -sd, -)
          echo "private_ids=$PRIVATE_CHANGED" >> "$GITHUB_OUTPUT"

      - name: Install Rust
        if: steps.changed.outputs.ids != ''
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        if: steps.changed.outputs.ids != ''
        uses: Swatinem/rust-cache@v2

      - name: Build validator
        if: steps.changed.outputs.ids != ''
        run: cargo build --release -p streamx-indexer-validator

      - name: Live selector smoke-test (changed sources only)
        if: steps.changed.outputs.ids != ''
        run: ./target/release/validator check --root . --live --tolerate-blocked --only "${{ steps.changed.outputs.ids }}"

      - name: Note on private-tracker files (no live check run)
        if: steps.changed.outputs.private_ids != ''
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: "This PR touches `sources/private/` (`${{ steps.changed.outputs.private_ids }}`) — the live smoke-test doesn't run against these since CI has no login session for a private tracker. Schema validation already ran above; selector correctness for this file needs a manual confirmation from the contributor or a reviewer against a real logged-in session (see docs/CONTRIBUTING.md § Adding a private tracker)."
            })
