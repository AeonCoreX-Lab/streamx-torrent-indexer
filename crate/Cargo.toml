[package]
name        = "streamx-indexer"
version     = "0.1.0"
edition     = "2021"
authors     = ["AeonCoreX-Lab"]
description = "Modular, config-driven torrent indexer engine for StreamX Ultra — site definitions live as JSON in sources/, kept in sync with upstream Jackett automatically."
license     = "MIT"
repository  = "https://github.com/AeonCoreX-Lab/streamx-torrent-indexer"
publish     = false

# Plain library — no cdylib/staticlib here. The consuming app (StreamX
# Ultra) depends on this as a normal Rust crate from its own
# app/src/main/rust/Cargo.toml and produces its own cdylib/staticlib
# artifacts. This crate has no JNI/Android coupling at all.
[lib]
crate-type = ["lib"]

[dependencies]
log         = "0.4"
anyhow      = "1.0"
thiserror   = "1"

once_cell   = "1.18"
parking_lot = "0.12"

reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "socks"] }

scraper = "0.20"

serde       = { version = "1", features = ["derive"] }
serde_json  = "1"
futures     = "0.3"
urlencoding = "2"
regex       = "1"

# Needed for real code, not just tests/dev — generic_html.rs uses
# tokio::time::sleep() for the per-request delay_ms rate-limit, and any
# consumer of this crate already runs inside a tokio runtime anyway
# (StreamX Ultra's JNI async bridge, tools/validator, tools/jackett-sync
# are all tokio-based), so pulling in the "time" feature here costs
# nothing extra in practice.
tokio = { version = "1", features = ["time"] }

[dev-dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }

[build-dependencies]
# build.rs only walks the filesystem and writes a generated .rs file —
# no external crates needed.
