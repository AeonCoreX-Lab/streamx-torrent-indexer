[package]
name    = "streamx-indexer-cli"
version = "0.1.0"
edition = "2021"
publish = false
description = "Small CLI for repo maintenance: assembles dist/registry.json from sources/ for hosting, and other one-off tasks."

[[bin]]
name = "streamx-indexer-cli"
path = "src/main.rs"

[dependencies]
streamx-indexer = { path = "../../crate" }

serde_json = "1"
anyhow     = "1.0"
clap       = { version = "4", features = ["derive"] }
