[package]
name    = "streamx-indexer-validator"
version = "0.1.0"
edition = "2021"
publish = false
description = "CI tool: validates sources/*.json against the schema, and (with --live) smoke-tests each site's selectors against a real fetch."

[[bin]]
name = "validator"
path = "src/main.rs"

[dependencies]
streamx-indexer = { path = "../../crate" }

serde       = { version = "1", features = ["derive"] }
serde_json  = "1"
jsonschema  = "0.18"
anyhow      = "1.0"
clap        = { version = "4", features = ["derive"] }
walkdir     = "2"
tokio       = { version = "1", features = ["rt-multi-thread", "macros"] }
reqwest     = { version = "0.12", default-features = false, features = ["rustls-tls"] }
scraper     = "0.20"
colored     = "2"
