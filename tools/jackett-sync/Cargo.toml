[package]
name    = "streamx-jackett-sync"
version = "0.1.0"
edition = "2021"
publish = false
description = "Fetches upstream Jackett's Cardigann YAML definitions and diffs their live domains against our sources/*.json, so a Jackett-side domain change is caught and PR'd automatically instead of silently going stale here."

[[bin]]
name = "jackett-sync"
path = "src/main.rs"

[dependencies]
streamx-indexer = { path = "../../crate" }

serde       = { version = "1", features = ["derive"] }
serde_json  = "1"
serde_yaml  = "0.9"
anyhow      = "1.0"
clap        = { version = "4", features = ["derive"] }
tokio       = { version = "1", features = ["rt-multi-thread", "macros"] }
reqwest     = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
colored     = "2"
